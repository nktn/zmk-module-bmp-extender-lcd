# モジュール行き (zmk-module-bmp-extender-lcd) のハード層設定。
# BMP Boost Extender Mini の FFC → ffc2mip-adapter 経由で Sharp LS011B7DH03 を
# 接続する配線 (bmp-extender-lcd.overlay: spi1 P0.17/P0.21/P0.31 +
# EXT_POWER P0.24) と、その上で動く LVGL 1bpp 描画パイプラインの既定値のみを
# 持つ。ステータス画面の内容などアプリケーション (キーボード) 固有の製品層
# 設定は、アプリ側が持つ独自のステータス画面スニペット/conf 側
# (例: tecla-cero の display-mip)。build.yaml では本スニペットと
# bmp-extender-lcd-vertical の後ろに置くこと。
CONFIG_ZMK_DISPLAY=y
# LCD 電源 (P0.24) を zmk,ext-power-generic (bmp-extender-lcd.overlay の
# EXT_POWER ノード) で制御するため有効化 (2026-08-02。ディープスリープ
# (System OFF) 前に確実にパネル電源を落とし、VCOM 反転停止中の DC バイアス
# 印加を防ぐため。overlay の EXT_POWER ノードのコメント参照)。
# 使用中の cormoran/zmk フォークでは
# CONFIG_ZMK_EXT_POWER に Kconfig 既定値が無く既定 n (target_sources_ifdef で
# src/ext_power_generic.c 自体のビルドを制御しているため、これが無いと
# EXT_POWER ノードがあっても P0.24 が未制御のまま起動する)
CONFIG_ZMK_EXT_POWER=y
# ZMK の意味論では INVERT=y は「白文字・黒背景」化だが、本構成では表示経路
# (MONO01/1bpp 変換) の極性が逆のため、実機では黒文字・白(銀)背景になる
# (2026-07-25 実機確認済み。反射型 MIP の視認性はこちらが良い)
CONFIG_ZMK_DISPLAY_INVERT=y
# 2026-08-02 実機ブートハング対策: v4 移行後の tecla_cero_right_central_display_ancs_usblog
# を実機に焼くと基板 LED 点灯のみ・キー入力/BLE/表示すべて死亡・USB 列挙だけ生存・CDC ログ
# 0 バイトという症状を確認。既定の CONFIG_ZMK_DISPLAY_WORK_QUEUE_SYSTEM では LVGL 描画が
# システムワークキュー (協調優先度) 上で動くため、描画側が無限停止すると割り込み以外の
# 全スレッドが飢餓になり上記症状と整合する。専用ワークキューに分離し、描画が刺さっても
# ログ・キー入力・BLE を延命させる (ZMK 公式も低速な表示ドライバには dedicated を推奨)。
# ZMK_DISPLAY_WORK_QUEUE は choice のため、選ぶ側の子シンボルを直接 y にして選択する
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
# LVGL9 の描画に余裕を持たせるため既定 3072 から増量
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
# LVGL8 時代の既定値 4096 は LVGL9 のメモリ要求増 (例: LV_DRAW_LAYER_SIMPLE_BUF_SIZE=24576)
# を超過し、lv_malloc 失敗 → LVGL assert ハンドラの無限ループに陥るのが上記ハングの最有力
# 仮説。RAM 256KB 中 96KB 使用で余裕があるため増量 (診断・恒久対策を兼ねる)
CONFIG_LV_Z_MEM_POOL_SIZE=16384
# 2026-08-02 実機で BLE/キーボード/レイヤー数の描画が v0.3(LVGL8) 時代より薄く
# 見える件の対策。ls0xx ドライバ自体は v0.3 と同一 (電気的問題ではない)。原因は
# LVGL8→9 の 1bpp(I1) 描画方式変化: LVGL8 はグレー無しの直接1bpp描画だったが、
# LVGL9 はAAフォント(Montserrat)込みで一旦グレー合成し、このしきい値で2値化する。
#
# 実装 (lvgl 1ed1ddd8 時点の src/draw/sw/blend/lv_draw_sw_blend_to_i1.c
# lv_draw_sw_blend_color_to_i1) を確認したセマンティクス:
#   src_color = luminance(描画色) / (しきい値+1)          ※整数除算
#   new_bit   = (mask値(=文字のAAカバレッジ 0-255) * src_color
#                + (255 - mask値) * 既存ビット) / 255     ※整数除算、非0で点灯
# ZMK は dark テーマ (CONFIG_ZMK_DISPLAY_INVERT=y) を使うため描画バッファ上は
# 白文字・黒背景 (実機での黒文字/白背景反転は表示パイプライン側の別の極性、上記
# コメント参照)。白文字 (luminance=255) の場合、点灯条件は実質
#   mask値(カバレッジ) >= 255 / floor(255/(しきい値+1))
# という「必要カバレッジ下限」になる。既定値 127 では floor(255/128)=1 となり
# mask値が 255 (完全被覆) でない限り点灯しない = AA輪郭の中間階調が丸ごと消灯側
# に丸められ、フォントが痩せて薄く見えていた。
#
# しきい値を下げる (=分母(しきい値+1)が小さくなる) ほど src_color が増え、必要
# カバレッジ下限が下がる = 白文字が太くなる。100 (÷101 → src_color=2) では必要
# カバレッジ 255/2≈128 (約50%) となり「半分以上覆われていれば点灯」という一般的
# な2値化の目安に相当し、既定の実質フル被覆要求よりはっきり太くなる。しきい値を
# 極端に下げすぎるとわずかなAAにじみでも点灯してブロック状に太りすぎるため
# 採用は控えめに: 実機で薄ければさらに下げる (0 に近づける)、太すぎ/潰れる場合は
# 上げる (127 側、範囲は Kconfig 上 0-254)
CONFIG_LV_DRAW_SW_I1_LUM_THRESHOLD=100
# 描画バッファを画面の 5% (約3ライン) に縮小し、LVGL フラッシュ = SPI
# トランザクションを約 0.5ms 単位に分割する。将来の改版基板でトラック
# ボールと SPI バスを共有したときのバス占有を抑えるため (codex レビュー条件)
CONFIG_LV_Z_VDB_SIZE=5
CONFIG_LV_DPI_DEF=161
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_COLOR_DEPTH_1=y
