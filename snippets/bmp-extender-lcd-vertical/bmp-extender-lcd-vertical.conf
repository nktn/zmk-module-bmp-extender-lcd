# モジュール行き (zmk-module-bmp-extender-lcd) のハード層追加設定。
# bmp-extender-lcd.conf の後に適用される前提 (build.yaml で bmp-extender-lcd の
# 後ろに置くこと。EXTRA_CONF_FILE は snippet の適用順 = build.yaml の記載順で
# 後勝ちに連結される)。

# ls0xx ドライバの回転実装 (drivers/display/ls0xx_swvcom.c) は、論理座標の部分更新でも
# 転置後は物理座標のほぼ全域に影響しうるため、LVGL 側の描画は「毎フレーム
# 全画面を1回で flush する」フルリフレッシュへ揃える。VDB_SIZE=100 を
# FULL_REFRESH と組み合わせると、コントローラ側に常に完全なフレームバッファ
# がある前提の構成になる (Kconfig.memory の LV_Z_FULL_REFRESH ヘルプ参照)。
# ドライバ自体は 2026-08-04 以降、flush されたフレームと直前の shadow
# フレームバッファをビット単位で比較し、実際に変化したパネル行の連続範囲
# だけを SPI 送信する (全行 clean なら送信自体をスキップする。詳細は
# drivers/display/ls0xx_swvcom.c の ls0xx_row_dirty/ls0xx_shadow_valid 定義コメント
# 参照)。つまり LVGL 側は毎回「全画面」を描画・flush するが、パネルへの
# 実際の SPI 送信は行単位の差分だけに絞られる、という二段構えになっている
CONFIG_LV_Z_FULL_REFRESH=y
# bmp-extender-lcd.conf の CONFIG_LV_Z_VDB_SIZE=5 (~3ライン単位分割、SPI バス占有
# 対策) をここで 100 (全フレーム) に上書きする。conf ファイルの適用順は
# build.yaml の snippet 文字列の記載順に従うため、本スニペットは必ず
# bmp-extender-lcd より後ろに置くこと (先に書くと bmp-extender-lcd.conf の 5 で
# 上書きされてしまう)。
# この制約を破って VDB_SIZE=5 のまま FULL_REFRESH=y になった場合は
# drivers/display/ls0xx_swvcom.c の BUILD_ASSERT (rotation!=0 ビルドで
# !CONFIG_LV_Z_FULL_REFRESH || CONFIG_LV_Z_VDB_SIZE>=100 を要求) が
# ビルドエラーとして検出する (2026-08-03 codex レビュー P2-2 対応)。
#
# 全68行を送る場合のコスト概算 (ドライバの dirty 判定で全行 dirty になる
# 最悪ケース、あるいは shadow_valid=false による強制全行送信時): 1 行 =
# ライン番号1B + データ20B(=160/8) + トレーラ1B = 22B、68行 + 先頭コマンド1B
# + 末尾トレーラ1B ≈ 1498B。1MHz SPI で 1498B*8bit ≈ 12ms。イベント駆動
# 更新 (連続アニメ無し) の設計要件なので実用上許容範囲と判断。実際の運用
# では変化した行だけが送信されるため (drivers/display/ls0xx_swvcom.c のライン単位差分
# 送信、2026-08-04 実装済み)、この最悪ケースに達するのは初回描画や
# 送信失敗からの復帰時など一部のケースに限られる。将来トラックボールと
# SPI バスを共有する改版基板でも、バス占有は変化があった行数に比例する
# 形にすでに縮小されている
CONFIG_LV_Z_VDB_SIZE=100
